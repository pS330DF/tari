# Windows packaging configuration (not yet produced or verified: requires a Windows build host
# and a bundled Python engine; see docs/status.md).
appId: ai.tari.companion
productName: TARI
directories:
  output: dist
files:
  - out/**
  - package.json
win:
  target: [nsis]
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
extraResources:
  - from: ../../packages/knowledge-base
    to: knowledge-base
